<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan Name Generator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Akan Name Generator</h1>

        <p>
            Akan names come from Ghanaian culture, where children are named based on the day they were born.
            Discover your traditional Akan name based on the day you were born.
        </p>

        <section class="generator" id="generator">

    <h2>Generate Your Akan Name</h2>

        <form id="akanForm">

        <div class="form-group">

        <label>Date of Birth</label>

        <input
        type="date"
        id="birthdate"
        required>

        </div>

        <div class="form-group">

        <label>Gender</label>

        <select id="gender" required>

        <option value="">
        Choose Gender
        </option>

        <option value="male">
        Male
        </option>

        <option value="female">
        Female
        </option>

        </select>

        </div>

    <button type="submit">Generate Name</button>
    <button type="button" id="resetBtn">
            Reset
    </button>
        </form>

        <div id="loader" class="loader hidden">
    <div class="spinner"></div>
    <p>Finding your Akan Name...</p>
    </div>

<div id="result"></div>
        <div id="result"></div>

        </div>

        </section>
        <audio id="celebrationSound">
    <source src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" type="audio/mpeg">
    </audio>


    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
        
</body>
</html>
